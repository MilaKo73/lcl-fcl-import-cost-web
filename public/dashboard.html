  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    #import-cost-dashboard {

      height: 2px;

      background: var(--viz-series-1);
    }

      height: 28px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      color: var(--primary-foreground);
      background: var(--primary);
      position: relative;
      z-index: 1;
    }

      color: var(--accent-foreground);
      background: var(--accent);
    }
    #import-cost-dashboard .route-label {
      margin-top: 8px;
      color: var(--foreground);
    }
    #import-cost-dashboard .route-sub {
      margin-top: 3px;
      color: var(--muted-foreground);
    }

      height: 10px;
      display: flex;
      overflow: hidden;
      background: var(--muted);
      border-radius: 999px;

      min-width: 0;
    }

    #import-cost-dashboard .share-inland { background: var(--viz-series-4); }
    #import-cost-dashboard .status-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    #import-cost-dashboard .status-item {
      display: grid;
      gap: 5px;
      padding-top: 10px;
      border-top: 2px solid var(--border);
    }

      border-top-color: var(--viz-series-3);
    }

      border-top-color: var(--destructive);
    }
    #import-cost-dashboard .status-title {
      font-weight: 500;
    }
    #import-cost-dashboard .table td,
    #import-cost-dashboard .table th {
      vertical-align: middle;
    }
    #import-cost-dashboard .recommended-row {
      background: color-mix(in srgb, var(--accent) 35%, transparent);
    }
    #import-cost-dashboard .source-note {
      color: var(--muted-foreground);
    }
    @media (max-width: 640px) {
      #import-cost-dashboard .control-set,
      #import-cost-dashboard .status-list,
      #import-cost-dashboard .dimension-grid {
        grid-template-columns: 1fr;
      }
      #import-cost-dashboard .viz-grid {
        grid-template-columns: 1fr;
      }

        grid-template-columns: 1fr;
        gap: 10px;
        padding-left: 4px;
      }

        text-align: left;

        grid-template-columns: 32px minmax(0, 1fr);
        column-gap: 10px;
      }

        top: 28px;
        bottom: -10px;
        left: 14px;
        width: 2px;
        height: auto;
      }
      #import-cost-dashboard .route-label {
        margin-top: 2px;
      }
      #import-cost-dashboard .route-sub {
        grid-column: 2;
      }
    }

  &lt;div class=&quot;source-note text-small&quot;&gt;
    데이터 상태: 예시값 · 안전운임과 세율은 가상 기본값이며 실제 계약·신고 전 적용 고시와 전문가 확인 필요 · 통화 KRW
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;import-cost-dashboard&quot;);
      const incotermsInput = root.querySelector(&quot;#incoterms&quot;);
      const pickupInput = root.querySelector(&quot;#pickup-address&quot;);
      const modeInputs = root.querySelectorAll(&#x27;input[name=&quot;shipping-mode&quot;]&#x27;);
      const containerInput = root.querySelector(&quot;#container-size&quot;);
      const destinationInput = root.querySelector(&quot;#destination-address&quot;);
      const lengthInput = root.querySelector(&quot;#cargo-length&quot;);
      const widthInput = root.querySelector(&quot;#cargo-width&quot;);
      const heightInput = root.querySelector(&quot;#cargo-height&quot;);
      const countInput = root.querySelector(&quot;#package-count&quot;);
      const weightInput = root.querySelector(&quot;#cargo-weight&quot;);
      const fxInput = root.querySelector(&quot;#exchange-rate&quot;);
      const hsInput = root.querySelector(&quot;#hs-code&quot;);

      const money = (value) =&gt; new Intl.NumberFormat(&quot;ko-KR&quot;, {
        style: &quot;currency&quot;,
        currency: &quot;KRW&quot;,
        maximumFractionDigits: 0
      }).format(value);

      const number = (value, digits = 2) =&gt; new Intl.NumberFormat(&quot;ko-KR&quot;, {
        minimumFractionDigits: 0,
        maximumFractionDigits: digits
      }).format(value);

      function renderRawRows(rows, fx) {
        return rows.map((row) =&gt; `
          &lt;tr&gt;
            &lt;td&gt;${row.segment}&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;${row.code}&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;${row.name}&lt;/td&gt;
            &lt;td&gt;${row.unit}&lt;/td&gt;
            &lt;td class=&quot;text-end&quot;&gt;${number(row.quantity)}&lt;/td&gt;
            &lt;td class=&quot;text-end&quot;&gt;${number(row.unitRate)}&lt;/td&gt;
            &lt;td class=&quot;text-end text-nowrap&quot;&gt;${money(row.quantity * row.unitRate * fx)}&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;가상&lt;/span&gt;&lt;/td&gt;
          &lt;/tr&gt;
        `).join(&quot;&quot;);
      }

      const containerData = {
        &quot;20gp&quot;: { label: &quot;20GP&quot;, usableCbm: 29.5, costDelta: 0, safeRateFactor: 1 },
        &quot;40gp&quot;: { label: &quot;40GP&quot;, usableCbm: 59.0, costDelta: 900, safeRateFactor: 1.22 },
        &quot;40hc&quot;: { label: &quot;40HC&quot;, usableCbm: 67.0, costDelta: 1100, safeRateFactor: 1.28 }
      };

      const destinationData = {
        seoul: { address: &quot;서울특별시 강남구 테헤란로&quot;, short: &quot;서울 강남구&quot;, distanceKm: 400, base20Krw: 880000 },
        icheon: { address: &quot;경기도 이천시 마장면&quot;, short: &quot;경기 이천시&quot;, distanceKm: 360, base20Krw: 790000 },
        daejeon: { address: &quot;대전광역시 대덕구&quot;, short: &quot;대전 대덕구&quot;, distanceKm: 240, base20Krw: 620000 },
        daegu: { address: &quot;대구광역시 달서구&quot;, short: &quot;대구 달서구&quot;, distanceKm: 110, base20Krw: 390000 },
        busan: { address: &quot;부산광역시 강서구&quot;, short: &quot;부산 강서구&quot;, distanceKm: 25, base20Krw: 220000 }
      };

      const pickupData = [
        { keywords: [&quot;rotterdam&quot;, &quot;waalhaven&quot;], city: &quot;Rotterdam&quot;, port: &quot;Rotterdam Port&quot;, code: &quot;NLRTM&quot;, distanceKm: 18, oceanFactor: 1, oceanDays: 22 },
        { keywords: [&quot;hamburg&quot;, &quot;billbrook&quot;], city: &quot;Hamburg&quot;, port: &quot;Hamburg Port&quot;, code: &quot;DEHAM&quot;, distanceKm: 12, oceanFactor: 0.96, oceanDays: 21 },
        { keywords: [&quot;shanghai&quot;, &quot;pudong&quot;], city: &quot;Shanghai&quot;, port: &quot;Shanghai Port&quot;, code: &quot;CNSHA&quot;, distanceKm: 35, oceanFactor: 0.72, oceanDays: 13 },
        { keywords: [&quot;shenzhen&quot;, &quot;bao&#x27;an&quot;, &quot;baoan&quot;], city: &quot;Shenzhen&quot;, port: &quot;Yantian Port&quot;, code: &quot;CNYTN&quot;, distanceKm: 42, oceanFactor: 0.78, oceanDays: 14 },
        { keywords: [&quot;long beach&quot;, &quot;california&quot;], city: &quot;Long Beach&quot;, port: &quot;Port of Long Beach&quot;, code: &quot;USLGB&quot;, distanceKm: 15, oceanFactor: 0.88, oceanDays: 17 }
      ];

      const tariffData = {
        &quot;847130&quot;: { name: &quot;휴대용 컴퓨터&quot;, duty: 0, vat: 10 },
        &quot;851713&quot;: { name: &quot;스마트폰&quot;, duty: 0, vat: 10 },
        &quot;620342&quot;: { name: &quot;남성 면바지&quot;, duty: 13, vat: 10 },
        &quot;640399&quot;: { name: &quot;가죽 갑피 신발&quot;, duty: 13, vat: 10 },
        &quot;950300&quot;: { name: &quot;완구류&quot;, duty: 8, vat: 10 },
        &quot;940360&quot;: { name: &quot;기타 목제가구&quot;, duty: 8, vat: 10 }
      };

      function normalizedHsCode(value) {
        return value.replace(/\D/g, &quot;&quot;).slice(0, 10);
      }

      function selectedMode() {
        return root.querySelector(&#x27;input[name=&quot;shipping-mode&quot;]:checked&#x27;).value;
      }

      function resolvePickup(value) {
        const normalized = value.toLowerCase();
        const matched = pickupData.find((item) =&gt; item.keywords.some((keyword) =&gt; normalized.includes(keyword)));
        return matched || {
          city: &quot;픽업지&quot;,
          port: &quot;메인항구 확인 필요&quot;,
          code: &quot;PENDING&quot;,
          distanceKm: 0,
          oceanFactor: 1,
          oceanDays: 22,
          pending: true
        };
      }

      function packageCbm() {
        const length = Math.max(0, Number(lengthInput.value));
        const width = Math.max(0, Number(widthInput.value));
        const height = Math.max(0, Number(heightInput.value));
        const count = Math.max(0, Number(countInput.value));
        return (length * width * height * count) / 1000000;
      }

      function costModel(cbm, weightKg, fx, incoterm, origin, containerKey, destinationKey) {
        const rt = Math.max(cbm, weightKg / 1000);
        const service = {
          days: origin.oceanDays + 6,
          oceanDays: origin.oceanDays,
          badge: &quot;직항&quot;,
          summary: &quot;직항 · 환적 0회&quot;,
          oceanLabel: `${origin.port}→부산항`
        };
        const container = containerData[containerKey];
        const destination = destinationData[destinationKey];
        const safeFreightKrw = Math.round(destination.base20Krw * container.safeRateFactor / 1000) * 1000;
        const lclPickupUsd = incoterm === &quot;EXW&quot; ? 350 + origin.distanceKm * 5 : 0;
        const fclPickupUsd = incoterm === &quot;EXW&quot; ? 500 + origin.distanceKm * 2 : 0;
        const lcl = {
          origin: lclPickupUsd + 180 + rt * 35,
          ocean: rt * 78 * origin.oceanFactor,
          destination: 320 + rt * 55,
          inland: 180 + 520
        };
        const fcl = {
          origin: fclPickupUsd + 180 + container.costDelta * 0.15,
          ocean: 1650 * origin.oceanFactor + container.costDelta,
          destination: 980 + container.costDelta * 0.25,
          inland: 180 + safeFreightKrw / fx
        };
        const lclUsd = Object.values(lcl).reduce((sum, value) =&gt; sum + value, 0);
        const fclUsd = Object.values(fcl).reduce((sum, value) =&gt; sum + value, 0);
        return {
          rt,
          lcl,
          fcl,
          lclKrw: lclUsd * fx,
          fclKrw: fclUsd * fx,
          service,
          container,
          destination,
          safeFreightKrw,
          origin,
          incoterm,
          lclPickupUsd,
          fclPickupUsd
        };
      }

      function update() {
        const incoterm = incotermsInput.value;
        const origin = resolvePickup(pickupInput.value);
        const mode = selectedMode();
        const containerKey = containerInput.value;
        const container = containerData[containerKey];
        const destinationKey = destinationInput.value;
        const cbm = mode === &quot;lcl&quot; ? packageCbm() : container.usableCbm;
        const weight = Number(weightInput.value);
        const fx = Number(fxInput.value) || 1380;
        const model = costModel(cbm, weight, fx, incoterm, origin, containerKey, destinationKey);
        const selectedCost = mode === &quot;fcl&quot; ? model.fclKrw : model.lclKrw;
        const hsCode = normalizedHsCode(hsInput.value);
        const tariff = tariffData[hsCode.slice(0, 6)];

          : [

        const oceanRawUsd = oceanRows.reduce((sum, row) =&gt; sum + row.quantity * row.unitRate, 0);
        const arrivalRawUsd = arrivalRows.reduce((sum, row) =&gt; sum + row.quantity * row.unitRate, 0);
        root.querySelector(&quot;#raw-data-mode&quot;).textContent = `${incoterm} · ${mode === &quot;fcl&quot; ? `FCL ${container.label}` : `LCL ${model.rt.toFixed(2)} R/T`} · ${model.origin.port} 선적 · 가상 데이터`;
        root.querySelector(&quot;#raw-ocean-body&quot;).innerHTML = renderRawRows(oceanRows, fx);

        root.querySelector(&quot;#raw-arrival-total&quot;).textContent = money(arrivalRawUsd * fx);

        const selectedParts = mode === &quot;fcl&quot; ? model.fcl : model.lcl;
        const selectedTotal = Object.values(selectedParts).reduce((sum, value) =&gt; sum + value, 0);
        root.querySelector(&quot;#share-origin&quot;).style.width = `${(selectedParts.origin / selectedTotal) * 100}%`;

      }

      [incotermsInput, pickupInput, ...modeInputs, containerInput, destinationInput, lengthInput, widthInput, heightInput, countInput, weightInput, fxInput, hsInput].forEach((control) =&gt; {

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {

    initialize();

&lt;/script&gt;
